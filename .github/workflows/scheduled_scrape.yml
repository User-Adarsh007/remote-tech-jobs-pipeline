name: Daily Remote Job Pipeline

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow anytime from the GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to allow the bot to push database updates back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Pipeline
        run: python pipeline.py

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add remote_tech_jobs.db
          git commit -m "Auto-update jobs database [skip ci]" || echo "No changes to commit"
          git push